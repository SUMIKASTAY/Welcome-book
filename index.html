<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to SUMIKA SHINJUKU</title>

  <!-- このページは /kita-shinjuku/ に統合されました。既存のQRコード・共有リンクを
       生かすため、削除せずリダイレクトページとして残しています。 -->
  <link rel="canonical" href="kita-shinjuku/">
  <meta http-equiv="refresh" content="0; url=kita-shinjuku/">
  <meta name="robots" content="noindex">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #60a5fa;
      }
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
      line-height: 1.7;
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      max-width: 26rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .10);
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: 1.15rem;
      font-weight: 800;
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: .92rem;
    }

    a.btn {
      display: inline-block;
      padding: .7rem 1.4rem;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a.btn:hover {
      filter: brightness(1.08);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Welcome to SUMIKA SHINJUKU</h1>
    <p>Redirecting to the guide…<br>案内ページへ移動しています…<br>正在跳转到指南页面…</p>
    <a class="btn" href="kita-shinjuku/">Open the guide</a>
  </div>

  <script>location.replace("kita-shinjuku/");</script>
</body>

</html>
